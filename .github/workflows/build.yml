name: Compilar APK Smart Hub

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissao de execucao ao Gradle
        run: chmod +x gradlew || true

      - name: Compilar APK com Gradle
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v3
        with:
          name: SmartHub-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk